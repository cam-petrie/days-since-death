name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test jar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: days-since-death
          path: build/libs/*.jar
